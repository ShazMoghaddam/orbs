name: Publish npm package

# Runs when a release tag like v1.8.0 is pushed. npm trusts this workflow directly
# (trusted publishing), so there is no token to store or leak, and every release gets
# a provenance statement linking it to the commit it was built from.
# The very first version (1.7.0) was published by hand, because npm only lets you set up
# trusted publishing for a package that already exists. A version already on npm is skipped.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@shazmoghaddam/orbs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || (echo "Tag $GITHUB_REF_NAME does not match version $version" && exit 1)
      - name: Skip if this version is already on npm
        id: published
        run: |
          if npm view "@shazmoghaddam/orbs@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"; echo "Already on npm, nothing to publish."
          fi
      - if: steps.published.outputs.already != 'true'
        run: npm ci
      - if: steps.published.outputs.already != 'true'
        run: npm run check
      - if: steps.published.outputs.already != 'true'
        name: Check orb.min.js is up to date
        run: test -z "$(git status --porcelain -- orb.min.js)" || (echo "Run npm run build and commit orb.min.js" && exit 1)
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships with npm 10.
      - if: steps.published.outputs.already != 'true'
        run: npm install -g npm@11
      - if: steps.published.outputs.already != 'true'
        run: npm publish
