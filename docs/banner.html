<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Orbs README banner</title>
<!-- Renders docs/banner.png (1280 x 400), the banner at the top of the README:
     python3 scripts/shot.py http://localhost:4173/docs/banner.html docs/banner.png 1280 400
     Then reduce it to 256 colours, as for social.html, to keep it small. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap">
<style>
  html, body { margin: 0; width: 1280px; height: 400px; overflow: hidden; }
  body {
    position: relative; font-family: "Geist", "Geist Variable", sans-serif; color: #F2EDE4;
    background: radial-gradient(55% 90% at 72% 50%, #2A1A10 0%, #0E0F0B 72%);
  }
  .copy { position: absolute; left: 64px; top: 0; bottom: 8px; width: 540px; display: grid; align-content: center; gap: 16px; }
  .mark { display: flex; align-items: center; gap: 16px; }
  .mark canvas { width: 72px; height: 72px; color: #FF7A45; }
  .mark span { font: 400 84px/1 "Fraunces", "Fraunces Variable", serif; letter-spacing: -0.012em; font-variation-settings: "opsz" 144; }
  .tag { font-size: 24px; line-height: 1.3; color: #E4DED2; letter-spacing: -0.01em; }
  .tag em { font-family: "Fraunces", "Fraunces Variable", serif; color: #FF7A45; }
  .sub { font: 500 15px/1.5 "Geist Mono", "Geist Mono Variable", monospace; color: #A49F93; }
  .orbs { position: absolute; left: 600px; right: 36px; top: 0; bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
  .orbs canvas { width: 160px; height: 160px; color: #FF7A45; display: block; }
  /* The footer's orange and sand, as a thin edge along the bottom. */
  .edge { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: linear-gradient(100deg, #FF7A45 0 58%, #EADCC6 58% 100%); }
</style>

<div class="copy">
  <div class="mark"><canvas data-orb="sphere" data-points="90" data-dot="1.3" data-shapes="sphere" aria-hidden="true"></canvas><span>Orbs</span></div>
  <div class="tag">Dot animations that <em>morph</em>, for the web.</div>
  <div class="sub">20 shapes · lines, glow and sound<br>One file · no dependencies</div>
</div>
<div class="orbs">
  <canvas data-orb="constellation" data-shapes="constellation" data-points="150" data-glow="5" data-dot="1.6" aria-hidden="true"></canvas>
  <canvas data-orb="wave" data-shapes="wave" data-style="lines" data-glow="6" aria-hidden="true"></canvas>
  <canvas data-orb="spikes" data-shapes="spikes" data-points="160" data-glow="5" data-dot="1.6" aria-hidden="true"></canvas>
  <canvas data-orb="infinity" data-shapes="infinity" data-points="150" data-glow="5" data-dot="1.8" aria-hidden="true"></canvas>
</div>
<div class="edge"></div>
<script src="../orb.js"></script>
</html>
