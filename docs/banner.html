<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Orbs README banner</title>
<!-- Renders docs/banner.png (1280 x 400), the banner at the top of the README:
     python3 scripts/shot.py http://localhost:4173/docs/banner.html docs/banner.png 1280 400 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap">
<style>
  html, body { margin: 0; width: 1280px; height: 400px; overflow: hidden; }
  body {
    position: relative; font-family: "Geist", "Geist Variable", sans-serif; color: #F2EDE4;
    background: radial-gradient(90% 140% at 8% 0%, #1B1C16 0%, #0E0F0B 70%);
  }
  .split { position: absolute; inset: 0 0 0 auto; width: 700px; background: linear-gradient(to bottom right, #FF7A45 50%, #EADCC6 50%); clip-path: polygon(14% 0, 100% 0, 100% 100%, 0 100%); }
  .copy { position: absolute; left: 64px; top: 0; bottom: 0; width: 520px; display: grid; align-content: center; gap: 18px; }
  .mark { display: flex; align-items: center; gap: 16px; }
  .mark canvas { width: 76px; height: 76px; color: #FF7A45; }
  .mark span { font: 400 84px/1 "Fraunces", "Fraunces Variable", serif; letter-spacing: -0.03em; font-variation-settings: "opsz" 144; }
  .tag { font-size: 25px; line-height: 1.3; color: #E4DED2; letter-spacing: -0.01em; }
  .tag em { font-family: "Fraunces", "Fraunces Variable", serif; color: #FF7A45; }
  .sub { font: 500 16px/1.4 "Geist Mono", "Geist Mono Variable", monospace; color: #A49F93; }
  .orbs { position: absolute; right: 44px; top: 50%; translate: 0 -50%; display: grid; grid-template-columns: repeat(3, 160px); gap: 4px 26px; }
  .orbs canvas { width: 160px; height: 160px; color: #2B0E02; display: block; }
</style>

<div class="split"></div>
<div class="copy">
  <div class="mark"><canvas data-orb="sphere" data-points="90" data-dot="1.3" data-shapes="sphere" aria-hidden="true"></canvas><span>Orbs</span></div>
  <div class="tag">Dot animations that <em>morph</em>, for the web.</div>
  <div class="sub">16 shapes · one file · no dependencies</div>
</div>
<div class="orbs">
  <canvas data-orb="torus" data-shapes="torus" data-points="150" data-dot="1.7" aria-hidden="true"></canvas>
  <canvas data-orb="ripple" data-shapes="ripple" data-points="150" data-dot="1.9" aria-hidden="true"></canvas>
  <canvas data-orb="bars" data-shapes="bars" data-points="150" data-dot="1.8" aria-hidden="true"></canvas>
  <canvas data-orb="helix" data-shapes="helix" data-points="150" data-dot="1.6" aria-hidden="true"></canvas>
  <canvas data-orb="infinity" data-shapes="infinity" data-points="150" data-dot="1.8" aria-hidden="true"></canvas>
  <canvas data-orb="check" data-shapes="check" data-points="150" data-dot="1.8" aria-hidden="true"></canvas>
</div>
<script src="../orb.js"></script>
</html>
